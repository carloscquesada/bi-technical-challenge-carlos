version: 2

models:
  - name: stg_hubspot_companies
    columns:
      - name: company_id
        data_tests:
          - not_null
          - unique

  - name: stg_hubspot_contacts
    columns:
      - name: contact_id
        data_tests:
          - not_null
          - unique

      - name: email
        data_tests:
          - not_null
          - unique

      - name: hubspot_company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_hubspot_companies')
                field: company_id

      - name: lifecycle_stage
        data_tests:
          - accepted_values:
              arguments:
                values: ['lead', 'opportunity', 'customer']

  - name: stg_hubspot_deals
    columns:
      - name: deal_id
        data_tests:
          - not_null
          - unique

      - name: hubspot_company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_hubspot_companies')
                field: company_id

      - name: deal_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['newbusiness', 'existing_business']

  - name: stg_backend_events
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique

      - name: user_id
        data_tests:
          - not_null

      - name: organization_id
        data_tests:
          - not_null

  - name: int_backend_users
    columns:
      - name: user_id
        data_tests:
          - not_null
          - unique

      - name: email
        data_tests:
          - not_null
          - unique

      - name: organization_id
        data_tests:
          - not_null

      - name: user_created_at
        data_tests:
          - not_null

  - name: int_organization_company_map
    columns:
      - name: organization_id
        data_tests:
          - not_null
          - unique

      - name: hubspot_company_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_hubspot_companies')
                field: company_id

  - name: mart_customers
    columns:
      - name: company_id
        data_tests:
          - not_null
          - unique

      - name: organization_id
        data_tests:
          - not_null
          - unique

      - name: first_customer_close_date
        data_tests:
          - not_null


  - name: mart_customer_contract_value
    columns:
      - name: company_id
        data_tests:
          - not_null
          - unique

      - name: initial_contract_value
        data_tests:
          - not_null

      - name: current_contract_value
        data_tests:
          - not_null

  - name: int_user_weekly_activity
    columns:
      - name: user_id
        data_tests:
          - not_null

      - name: organization_id
        data_tests:
          - not_null

      - name: activity_week
        data_tests:
          - not_null

  - name: mart_user_weekly_retention
    columns:
      - name: cohort_week
        data_tests:
          - not_null
          - unique

      - name: cohort_size
        data_tests:
          - not_null

  - name: mart_customer_monthly_usage
    columns:
      - name: company_id
        data_tests:
          - not_null

      - name: activity_month
        data_tests:
          - not_null

      - name: active_users
        data_tests:
          - not_null

      - name: meaningful_events
        data_tests:
          - not_null
  - name: mart_user_retention_summary
    columns:

      - name: retention_period
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['W1', 'W2', 'W3', 'W4', 'W8']

      - name: retained_user_weeks
        data_tests:
          - not_null

      - name: eligible_user_weeks
        data_tests:
          - not_null

      - name: retention_pct
        data_tests:
          - not_null

  - name: mart_customer_engagement
    columns:
      - name: company_id
        data_tests:
          - not_null
          - unique

      - name: current_contract_value
        data_tests:
          - not_null

      - name: active_months_last_3_complete_months
        data_tests:
          - not_null

      - name: meaningful_events_last_3_complete_months
        data_tests:
          - not_null

      - name: avg_monthly_meaningful_events_last_3_complete_months
        data_tests:
          - not_null

      - name: customer_success_review_flag
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]